<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>音乐推荐实验室</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#10131b;color:#edf1f8}*{box-sizing:border-box}body{margin:0}main{max-width:1160px;margin:50px auto;padding:0 24px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}small,.muted{color:#a2adc3}h1{font-size:36px;margin:10px 0}h2{font-size:22px}p{line-height:1.7}button,input,select{font:inherit;border:1px solid #36425a;border-radius:8px;padding:10px 14px;background:#202839;color:#edf1f8}button{cursor:pointer}button:hover{background:#344569}input{min-width:150px}button.primary{background:#7767ee;border:0}section{margin-top:32px}nav{display:flex;gap:10px;flex-wrap:wrap}.notice{border-left:3px solid #b2a5ff;padding:12px 18px;background:#1b2030}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px}.track{padding:20px;background:#1a2130;border:1px solid #30394f;border-radius:12px}.track h3{margin:10px 0}.tag{color:#c2b8ff;font-size:13px}.actions{display:flex;gap:8px;margin-top:18px}.details{font-size:12px;line-height:1.8;color:#aebad2}.player{position:sticky;bottom:0;background:#10131bf5;border-top:1px solid #30394f;padding:14px 0;margin-top:30px}audio{width:100%;margin-top:8px}#status{min-height:26px;color:#cbbfff}@media(max-width:600px){header{display:block}h1{font-size:28px}main{margin:25px auto}}
</style></head><body><main>
<header><div><small>音乐推荐实验室 / MUSIC LAB</small><h1>发现下一首喜欢的歌</h1><p class="muted">从听歌偏好、歌词语义和音频风格中寻找关联。</p></div><span class="tag">协同过滤 × Word2Vec × 音频</span></header>
<p>{% if user.is_authenticated %}{{ user.username }} <form method="post" action="/accounts/logout/" style="display:inline">{% csrf_token %}<button>退出登录</button></form>{% else %}<a href="/accounts/login/" style="color:#c2b8ff">登录</a> · <a href="/accounts/signup/" style="color:#c2b8ff">注册</a> · 当前使用访客偏好{% endif %}</p>
<p class="notice">演示曲目使用原创短音调和虚构歌词，演示用户为合成数据；它们用于体验流程，不代表真实推荐效果。真实曲库的歌词或音频缺失时，系统会自动使用可用信号。</p>
<section><nav><input id="search" placeholder="搜索歌名、作者或风格" aria-label="搜索"><button id="find">搜索</button><button id="all">全部歌曲</button><button id="favorites">我的收藏</button><select id="genre" aria-label="偏好风格"><option value="">根据我的偏好</option>{% for g in genres %}<option>{{ g }}</option>{% endfor %}</select><button class="primary" id="refresh">刷新推荐</button></nav></section>
<p id="status" role="status"></p><section><h2>为你推荐 · Top 5</h2><div id="recommendations" class="grid"></div></section>
<section><h2 id="catalog-title">曲库</h2><div id="tracks" class="grid"></div></section>
<div class="player"><span id="playing">选择一首歌开始播放</span><audio id="audio" controls></audio></div>
</main><script>
const $=s=>document.querySelector(s);let liked=new Set();
function message(s){$('#status').textContent=s}
async function api(url, options={}){const r=await fetch(url,options);const d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}
function csrf(){return document.cookie.split('; ').find(x=>x.startsWith('csrftoken='))?.split('=')[1]||''}
async function event(id,type){await api('/api/interactions',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify({track_id:id,event:type})})}
function render(items,target){const node=$(target);node.replaceChildren();if(!items.length){node.textContent='暂无歌曲。请先初始化曲库，或调整搜索和偏好。';return}
for(const t of items){const card=document.createElement('article');card.className='track';const tag=document.createElement('span');tag.className='tag';tag.textContent=t.genre+(t.is_demo?' · 演示':'');const title=document.createElement('h3');title.textContent=t.title;const artist=document.createElement('small');artist.textContent=t.artist||'GTZAN';card.append(tag,title,artist);
if(t.components){const details=document.createElement('p');details.className='details';const labels={audio:'音频',lyrics:'歌词',collaborative:'协同'};details.textContent=Object.entries(t.components).map(([k,v])=>labels[k]+' '+v.toFixed(3)).join(' · ')||(t.fallback?'热门回退':'暂无特征');card.append(details)}
const buttons=document.createElement('div');buttons.className='actions';const play=document.createElement('button');play.textContent='播放';play.disabled=!t.audio_url;play.onclick=async()=>{try{$('#audio').src=t.audio_url;await $('#audio').play();await event(t.id,'play');$('#playing').textContent=t.title;await recommendations()}catch(e){message('播放失败，请检查音频文件是否已准备好。')}};
const like=document.createElement('button');const update=()=>{like.textContent=liked.has(t.id)?'取消收藏':'♡ 收藏';like.setAttribute('aria-pressed',liked.has(t.id))};update();like.onclick=async()=>{try{const exists=liked.has(t.id);await event(t.id,exists?'unlike':'like');exists?liked.delete(t.id):liked.add(t.id);await loadCatalog();await recommendations();message('偏好已更新')}catch(e){message(e.message)}};buttons.append(play,like);card.append(buttons);node.append(card)}}
let favorites=false;
async function loadCatalog(){const d=await api('/api/tracks?q='+encodeURIComponent($('#search').value)+(favorites?'&favorites=1':''));if(!favorites&&!$('#search').value)liked=new Set(d.tracks.filter(t=>t.liked).map(t=>t.id));else for(const t of d.tracks){t.liked?liked.add(t.id):liked.delete(t.id)}render(d.tracks,'#tracks');$('#catalog-title').textContent=favorites?'我的收藏':'曲库'}
async function recommendations(){const d=await api('/api/recommendations?genre='+encodeURIComponent($('#genre').value));render(d.tracks,'#recommendations')}
async function run(fn){try{await fn()}catch(e){message(e.message)}}
$('#find').onclick=()=>run(loadCatalog);$('#search').onkeydown=e=>{if(e.key==='Enter')run(loadCatalog)};$('#all').onclick=()=>{favorites=false;$('#search').value='';run(loadCatalog)};$('#favorites').onclick=()=>{favorites=true;run(loadCatalog)};$('#refresh').onclick=()=>run(recommendations);$('#genre').onchange=()=>run(recommendations);$('#audio').onerror=()=>message('音频无法加载，请检查本地音频文件。');run(async()=>{await loadCatalog();await recommendations()});
</script></body></html>
